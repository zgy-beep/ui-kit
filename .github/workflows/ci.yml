name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 一键门禁（静态 + 打包；无 Chrome 自动跳过浏览器段）
        run: npm run verify:all -- --no-browser
      - name: 下游 4 资产自检
        run: |
          mkdir -p /tmp/downstream/ui-kit/test
          cp tokens.css components.css nvui-api.js tokens.json package.json /tmp/downstream/ui-kit/
          cp test/downstream-check.js /tmp/downstream/ui-kit/test/
          cd /tmp/downstream/ui-kit
          node test/downstream-check.js

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验发布契约并打包（verify:all 内含 pack + 产物校验）
        run: npm run verify:all -- --no-browser
      # Release notes 由人工按 MAINTAINING.md §2.4 撰写（版本定位 / 核心更新 / 兼容性 / 验证数据），
      # CI 只负责传产物。此前用 action-gh-release + generate_release_notes 会把正文整段覆盖成
      # 自动生成的 "Full Changelog"（v2.8.3 实测），故改为 gh CLI 只做 upload。
      - name: 创建 / 更新 GitHub Release（不覆盖手写 notes）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files="dist/ui-kit-${tag#v}.zip dist/SHA256SUMS dist/manifest.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" --title "$tag" \
              --notes "变更明细见 CHANGELOG.md 的 \`## ${tag}\` 条目。" $files
          fi
